name: Update IP List

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Fetch data
        run: |
          set -euo pipefail

          mkdir -p Clash
          mkdir -p List

          TIMESTAMP=$(date -u "+%Y-%m-%d %H:%M:%S UTC")

          API_RESPONSE=$(curl -fsS \
            "https://api.cloudflare.com/client/v4/ips?networks=jdcloud")

          IP_LIST=$(echo "$API_RESPONSE" |
            jq -r '.result.jdcloud_cidrs[]' |
            sort -u)

          echo "$IP_LIST" > List/cf_cn_ip.txt

          {
            echo "# Cloudflare China Mainland Network (JD Cloud)"
            echo "# Generated: $TIMESTAMP"
            echo "# Source: https://api.cloudflare.com/client/v4/ips?networks=jdcloud"
            echo "$IP_LIST" | sed 's/^/IP-CIDR,/'
          } > Clash/cf_cn_ip.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Clash/cf_cn_ip.txt
          git add List/cf_cn_ip.txt

          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update Cloudflare China Mainland Network IP list [skip ci]"
            git push
          fi
